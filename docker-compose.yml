services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: korobos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: korobos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U korobos -d korobos" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka-certs:
    image: confluentinc/cp-kafka:7.5.0
    volumes:
      - kafka_certs:/etc/kafka/secrets
      - ./infrastructure/docker/kafka/generate-certs.sh:/opt/korobos/kafka/generate-certs.sh:ro
    entrypoint: ["/bin/bash", "/opt/korobos/kafka/generate-certs.sh"]
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    entrypoint:
      - /bin/bash
      - -lc
      - /etc/confluent/docker/configure && /etc/confluent/docker/launch
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:9093,SASL_SSL_INTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://localhost:9093,SASL_SSL_INTERNAL://kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,SASL_SSL_INTERNAL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/server.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEYSTORE_TYPE: JKS
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_TYPE: JKS
      KAFKA_SSL_KEYSTORE_FILENAME: server.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf -Dzookeeper.sasl.clientconfig=ZkClient
      KAFKA_LISTENER_NAME_SASL_SSL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="korobos" password="korobos-secret" user_korobos="korobos-secret";
      KAFKA_LISTENER_NAME_SASL_SSL_INTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="korobos" password="korobos-secret" user_korobos="korobos-secret";
    ports:
      - "9093:9093"
    volumes:
      - kafka_certs:/etc/kafka/secrets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9093 --command-config /etc/kafka/secrets/client.properties >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      zookeeper:
        condition: service_started
      kafka-certs:
        condition: service_completed_successfully

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVER=kafka:29093
      - KAFKA_CLIENT_CONFIG=/etc/kafka/secrets/client.properties
    volumes:
      - kafka_certs:/etc/kafka/secrets:ro
      - ./infrastructure/docker/kafka/create-topics.sh:/opt/korobos/kafka/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/korobos/kafka/create-topics.sh"]
    restart: "no"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    command:
      - --kafka.server=kafka:29093
      - --tls.enabled
      - --tls.ca-file=/etc/kafka/secrets/ca.crt
      - --sasl.enabled
      - --sasl.username=korobos
      - --sasl.password=korobos-secret
      - --sasl.mechanism=plain
      - --web.listen-address=:9308
    ports:
      - "9308:9308"
    volumes:
      - kafka_certs:/etc/kafka/secrets:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: 'masterKey'
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rootuser
      MINIO_ROOT_PASSWORD: rootpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Application Microservices ---
  api-gateway:
    build:
      context: .
      dockerfile: backend/gateway/api-gateway/Dockerfile
    ports:
      - "8080:8000"
    environment:
      - SERVICES_AUTH=http://auth-service:8000
      - SERVICES_NOTES=http://notes-service:8000
      - SERVICES_HABITS=http://habit-service:8000
      - SERVICES_LEARNING=http://learning-service:8000
      - SERVICES_HEALTH=http://health-service:8000
      - SERVICES_ANALYTICS=http://analytics-service:8000
      - SERVICES_NOTIFICATIONS=http://notification-service:8000
      - SERVICES_AI=http://ai-service:8000
      - SERVICES_DATABASE=http://database-service:8000
      - SERVICES_DASHBOARD=http://dashboard-service:8000
      - SERVICES_SEARCH=http://search-service:8000
      - SERVICES_GRAPH=http://graph-service:8000
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=dev-secret-key
    depends_on:
      - auth-service
      - notes-service
      - habit-service
      - learning-service
      - health-service
      - analytics-service
      - notification-service
      - ai-service
      - database-service
      - dashboard-service
      - search-service
      - graph-service
      - redis

  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://korobos:password@postgres:5432/korobos
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKER=kafka:29093
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - KAFKA_SASL_MECHANISM=PLAIN
      - KAFKA_SASL_USERNAME=korobos
      - KAFKA_SASL_PASSWORD=korobos-secret
      - KAFKA_SSL_CA_FILE=/etc/korobos/kafka/ca.crt
      - JWT_SECRET=dev-secret-key
    volumes:
      - kafka_certs:/etc/korobos/kafka:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  notes-service:
