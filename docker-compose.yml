        condition: service_completed_successfully

  search-worker:
    build:
      context: .
      dockerfile: backend/workers/Dockerfile
    command: ["python", "-m", "backend.workers.search_worker"]
    environment:
      - KAFKA_BROKER=kafka:29093
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - KAFKA_SASL_MECHANISM=PLAIN
      - KAFKA_SASL_USERNAME=cortexos
      - KAFKA_SASL_PASSWORD=cortexos-secret
      - KAFKA_SSL_CA_FILE=/etc/cortexos/kafka/ca.crt
      - SEARCH_URL=http://meilisearch:7700
      - SEARCH_API_KEY=masterKey
      - SERVICE_NAME=search-worker
    volumes:
      - kafka_certs:/etc/cortexos/kafka:ro
    depends_on:
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started

  ai-worker:
    build:
      context: .
      dockerfile: backend/workers/Dockerfile
    command: ["python", "-m", "backend.workers.ai_worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://cortexos:password@postgres:5432/cortexos
      - KAFKA_BROKER=kafka:29093
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - KAFKA_SASL_MECHANISM=PLAIN
      - KAFKA_SASL_USERNAME=cortexos
      - KAFKA_SASL_PASSWORD=cortexos-secret
      - KAFKA_SSL_CA_FILE=/etc/cortexos/kafka/ca.crt
      - SERVICE_NAME=ai-worker
    volumes:
      - kafka_certs:/etc/cortexos/kafka:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  # --- Frontend Application ---
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    tty: true
    stdin_open: true
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:
  kafka_certs:
