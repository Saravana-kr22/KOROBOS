        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  analytics-worker:
    build:
      context: .
      dockerfile: backend/workers/Dockerfile
    command: ["python", "-m", "backend.workers.analytics_worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://cortexos:password@postgres:5432/cortexos
      - KAFKA_BROKER=kafka:29093
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - KAFKA_SASL_MECHANISM=PLAIN
      - KAFKA_SASL_USERNAME=cortexos
      - KAFKA_SASL_PASSWORD=cortexos-secret
      - KAFKA_SSL_CA_FILE=/etc/cortexos/kafka/ca.crt
      - SERVICE_NAME=analytics-worker
    volumes:
      - kafka_certs:/etc/cortexos/kafka:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  notification-worker:
    build:
      context: .
      dockerfile: backend/workers/Dockerfile
    command: ["python", "-m", "backend.workers.notification_worker"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://cortexos:password@postgres:5432/cortexos
      - KAFKA_BROKER=kafka:29093
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - KAFKA_SASL_MECHANISM=PLAIN
      - KAFKA_SASL_USERNAME=cortexos
      - KAFKA_SASL_PASSWORD=cortexos-secret
      - KAFKA_SSL_CA_FILE=/etc/cortexos/kafka/ca.crt
      - SERVICE_NAME=notification-worker
    volumes:
