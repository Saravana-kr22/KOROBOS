      - KAFKA_BROKER=kafka:29093
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - KAFKA_SASL_MECHANISM=PLAIN
      - KAFKA_SASL_USERNAME=cortexos
      - KAFKA_SASL_PASSWORD=cortexos-secret
      - KAFKA_SSL_CA_FILE=/etc/cortexos/kafka/ca.crt
    volumes:
