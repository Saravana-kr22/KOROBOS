    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    ports:
      - "8006:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cortexos:password@postgres:5432/cortexos
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKER=kafka:29093
      - KAFKA_SECURITY_PROTOCOL=SASL_SSL
      - KAFKA_SASL_MECHANISM=PLAIN
      - KAFKA_SASL_USERNAME=cortexos
      - KAFKA_SASL_PASSWORD=cortexos-secret
      - KAFKA_SSL_CA_FILE=/etc/cortexos/kafka/ca.crt
    volumes:
