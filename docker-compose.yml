  ai-service:
    build:
      context: .
      dockerfile: backend/services/ai-service/Dockerfile
    ports:
      - "8007:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cortexos:password@postgres:5432/cortexos
