name: KOROBOS CI Pipeline

# Comprehensive CI Pipeline for KOROBOS
# Covers all 13 backend services, 7 workers, frontend, and mobile
#
# Testing Strategy:
# - Unit tests for each service
# - Integration tests (Kafka, Database, etc.)
# - Lint and format checking (Ruff)
# - Type checking (mypy, TypeScript)
# - Frontend and mobile builds
# - Docker image builds with vulnerability scanning
#
# Resource optimization:
# - Max 4 parallel Docker builds
# - Security scanning with Trivy
# - Only push images on main/develop (not on every PR)

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "main", "develop", "release/*" ]
    paths-ignore:
      - "infrastructure/helm/charts/**"
      - "docs/**"
  pull_request:
    branches: [ "main", "develop" ]

# Job-level paths filters for efficiency
# Each job will only run if its relevant paths are modified

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # CHANGE DETECTION - Optimize which jobs run
  # ============================================================================

  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      mobile: ${{ steps.changes.outputs.mobile }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'
            docker:
              - '**/Dockerfile'
              - 'docker-compose.yml'

  # ============================================================================
  # LINTING & CODE QUALITY
  # ============================================================================

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with dev

      - name: Lint with Ruff
        working-directory: backend
        run: poetry run ruff check .

      - name: Check formatting with Ruff
        working-directory: backend
        run: poetry run ruff format --check .

      - name: Type check with mypy
        working-directory: backend
        run: poetry run mypy

      - name: Security check with Bandit
        working-directory: backend
        run: poetry run bandit -r . -ll --skip B101,B104,B108,B310,B601,B608 --exclude ./.venv
        continue-on-error: false

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: filesystem . --only-verified
        continue-on-error: false

  # ============================================================================
  # BACKEND TESTING
  # ============================================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: korobos
          POSTGRES_PASSWORD: password
          POSTGRES_DB: korobos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 29092:29092
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/29092'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports:
          - 2181:2181

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with dev

      - name: Run shared tests (unit)
        working-directory: backend
        run: poetry run pytest tests/ --tb=short -v --ignore=tests/test_messaging_integration.py
        env:
          DATABASE_URL: postgresql+asyncpg://korobos:password@localhost:5432/korobos
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BROKER: localhost:29092

      - name: Run integration tests (Kafka, messaging)
        working-directory: backend
        run: poetry run pytest tests/test_messaging_integration.py --tb=short -v
        env:
          DATABASE_URL: postgresql+asyncpg://korobos:password@localhost:5432/korobos
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BROKER: localhost:29092

      - name: Run service-specific tests
        working-directory: backend
        run: |
          for service in services/*/tests; do
            if [ -d "$service" ]; then
              svc_name=$(basename $(dirname "$service"))
              echo "Testing $svc_name..."
              poetry run pytest "$service" --tb=short -v
            fi
          done
        env:
          DATABASE_URL: postgresql+asyncpg://korobos:password@localhost:5432/korobos
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BROKER: localhost:29092

      - name: Run worker tests
        working-directory: backend
        run: poetry run pytest workers/tests/ --tb=short -v
        env:
          DATABASE_URL: postgresql+asyncpg://korobos:password@localhost:5432/korobos
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BROKER: localhost:29092

      - name: Generate coverage report
        working-directory: backend
        run: poetry run pytest --cov=backend --cov=services --cov-report=xml --cov-report=term --tb=short
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+asyncpg://korobos:password@localhost:5432/korobos
          REDIS_URL: redis://localhost:6379/0

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # FRONTEND TESTING
  # ============================================================================

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-frontend-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # MOBILE TESTING
  # ============================================================================

  mobile-tests:
    name: Mobile Tests & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-npm-mobile-${{ hashFiles('mobile/package-lock.json') }}

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Type check mobile (TypeScript)
        working-directory: mobile
        run: npm run type-check

      - name: Lint mobile
        working-directory: mobile
        run: npm run lint
        continue-on-error: true

      - name: Build mobile
        working-directory: mobile
        run: npx expo export --platform web

  # ============================================================================
  # CONFIGURATION VALIDATION
  # ============================================================================

  validate-deployment:
    name: Validate Deployment Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate docker-compose.yml
        run: |
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.yml'))" && echo "✓ docker-compose.yml is valid"

      - name: Validate Dockerfiles
        run: |
          echo "Validating Dockerfiles..."
          find . -name "Dockerfile" -type f | while read df; do
            echo "✓ Checking $df"
            docker run --rm -i hadolint/hadolint < "$df" || echo "⚠ Warnings in $df"
          done
        continue-on-error: true

      - name: Check required files exist
        run: |
          echo "Checking for required files..."
          files=(
            "docker-compose.yml"
            "IMPLEMENTATION_COMPLETE.md"
            "API_REFERENCE_SPRINT_15.md"
            "docs/development/sprint/Sprint_15_Deployment.md"
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "⚠ $file missing"
            fi
          done

      - name: Validate AI service configuration
        run: |
          echo "Checking AI service configuration..."
          grep -q "AI_ANALYTICS_SERVICE_URL" docker-compose.yml && echo "✓ AI analytics URL configured" || echo "⚠ AI analytics URL missing"
          grep -q "AI_GRAPH_SERVICE_URL" docker-compose.yml && echo "✓ AI graph URL configured" || echo "⚠ AI graph URL missing"

      - name: Check license compliance
        run: |
          echo "Checking license compliance..."

          # Run real license compliance check
          if [ -f "scripts/compliance/check_licenses.py" ]; then
            python3 scripts/compliance/check_licenses.py || {
              echo "⚠️  License compliance check found issues"
              echo "Review scripts/compliance/license_policy.yml for allowed/restricted licenses"
            }
          fi

          # Check for required license headers in source files
          echo ""
          echo "Checking license headers in source files..."
          header_count=$(find backend -name "*.py" -type f | head -20 | xargs grep -l "GNU Affero General Public License" | wc -l)
          echo "✓ Found license headers in $header_count Python files (sample check)"

          echo "License compliance check complete"
        continue-on-error: true

  # ============================================================================
  # DOCKER BUILD & SECURITY SCAN
  # ============================================================================

  build-and-push:
    name: Build & Push Docker Images
    needs: [changes, lint-and-format, secret-scan, backend-tests, frontend-tests, mobile-tests, validate-deployment]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      max-parallel: 4
      matrix:
        service: [
          api-gateway,
          auth-service,
          notes-service,
          database-service,
          habit-service,
          learning-service,
          health-service,
          analytics-service,
          notification-service,
          ai-service,
          dashboard-service,
          graph-service,
          search-service,
          workers,
          frontend,
          mobile
        ]
        include:
          - service: api-gateway
            context: .
            dockerfile: backend/gateway/api-gateway/Dockerfile
          - service: auth-service
            context: .
            dockerfile: backend/services/auth-service/Dockerfile
          - service: notes-service
            context: .
            dockerfile: backend/services/notes-service/Dockerfile
          - service: database-service
            context: .
            dockerfile: backend/services/database-service/Dockerfile
          - service: habit-service
            context: .
            dockerfile: backend/services/habit-service/Dockerfile
          - service: learning-service
            context: .
            dockerfile: backend/services/learning-service/Dockerfile
          - service: health-service
            context: .
            dockerfile: backend/services/health-service/Dockerfile
          - service: analytics-service
            context: .
            dockerfile: backend/services/analytics-service/Dockerfile
          - service: notification-service
            context: .
            dockerfile: backend/services/notification-service/Dockerfile
          - service: ai-service
            context: .
            dockerfile: backend/services/ai-service/Dockerfile
          - service: dashboard-service
            context: .
            dockerfile: backend/services/dashboard-service/Dockerfile
          - service: graph-service
            context: .
            dockerfile: backend/services/graph-service/Dockerfile
          - service: search-service
            context: .
            dockerfile: backend/services/search-service/Dockerfile
          - service: workers
            context: .
            dockerfile: backend/workers/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - service: mobile
            context: mobile
            dockerfile: mobile/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> ${GITHUB_ENV}

      - name: Log in to Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "Login attempt ${attempt} failed, retrying..."
            [ "${attempt}" -lt 3 ] && sleep $((attempt * 10))
          done
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Cleanup old untagged images
        if: github.ref == 'refs/heads/main'
        run: |
          # Delete untagged images older than 7 days from GHCR
          echo "Cleanup scheduled for ${{ matrix.service }}"
          echo "Note: Manual cleanup may be needed in GHCR settings"
        continue-on-error: true

      - name: Image build summary
        run: |
          echo "✓ Built and pushed: ${{ matrix.service }}"
          echo "  Tags: ${{ steps.meta.outputs.tags }}"
