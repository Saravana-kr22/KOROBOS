name: KOROBOS CI Pipeline

permissions:
  contents: read
  packages: write
on:
  push:
    branches: [ "main", "develop", "release/*" ]
    paths-ignore:
      - "infrastructure/helm/charts/**"
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Backend dependencies
        working-directory: ./backend
        run: |
          poetry install --with dev

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Lint with Ruff
        working-directory: ./backend
        run: poetry run ruff check .

      - name: Check formatting with Ruff
        working-directory: ./backend
        run: poetry run ruff format --check .

      - name: Run backend test suite
        working-directory: ./backend
        run: poetry run pytest tests --tb=short --ignore=tests/test_messaging_integration.py

      - name: Run Kafka integration tests
        working-directory: ./backend
        run: poetry run pytest tests/test_messaging_integration.py -q

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      max-parallel: 4
      matrix:
        service: [
          api-gateway,
          auth-service,
          notes-service,
          habit-service,
          learning-service,
          health-service,
          analytics-service,
          notification-service,
          ai-service,
          workers,
          frontend
        ]
        include:
          - service: api-gateway
            context: .
            dockerfile: backend/gateway/api-gateway/Dockerfile
          - service: auth-service
            context: .
            dockerfile: backend/services/auth-service/Dockerfile
          - service: notes-service
            context: .
            dockerfile: backend/services/notes-service/Dockerfile
          - service: habit-service
            context: .
            dockerfile: backend/services/habit-service/Dockerfile
          - service: learning-service
            context: .
            dockerfile: backend/services/learning-service/Dockerfile
          - service: health-service
            context: .
            dockerfile: backend/services/health-service/Dockerfile
          - service: analytics-service
            context: .
            dockerfile: backend/services/analytics-service/Dockerfile
          - service: notification-service
            context: .
            dockerfile: backend/services/notification-service/Dockerfile
          - service: ai-service
            context: .
            dockerfile: backend/services/ai-service/Dockerfile
          - service: workers
            context: .
            dockerfile: backend/workers/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: |
          echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> ${GITHUB_ENV}

      - name: Log in to the Container registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "GHCR login attempt ${attempt} failed"
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
