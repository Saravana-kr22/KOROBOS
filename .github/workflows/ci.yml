name: CortexOS CI Pipeline

permissions:
  contents: read
  packages: write
on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Backend dependencies
        working-directory: ./backend
        run: |
          poetry install --with dev

      - name: Lint with Ruff
        working-directory: ./backend
        run: poetry run ruff check .

      - name: Check formatting with Black
        working-directory: ./backend
        run: poetry run black --check .

      - name: Run unit tests
        working-directory: ./backend
        run: poetry run pytest tests/ --tb=short

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run lint

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    strategy:
      matrix:
        service: [
          api-gateway,
          auth-service,
          notes-service,
          habit-service,
          learning-service,
          health-service,
          analytics-service,
          notification-service,
          ai-service,
          frontend
        ]
        include:
          - service: api-gateway
            context: backend
            dockerfile: backend/gateway/api-gateway/Dockerfile
          - service: auth-service
            context: backend
            dockerfile: backend/services/auth-service/Dockerfile
          - service: notes-service
            context: backend
            dockerfile: backend/services/notes-service/Dockerfile
          - service: habit-service
            context: backend
            dockerfile: backend/services/habit-service/Dockerfile
          - service: learning-service
            context: backend
            dockerfile: backend/services/learning-service/Dockerfile
          - service: health-service
            context: backend
            dockerfile: backend/services/health-service/Dockerfile
          - service: analytics-service
            context: backend
            dockerfile: backend/services/analytics-service/Dockerfile
          - service: notification-service
            context: backend
            dockerfile: backend/services/notification-service/Dockerfile
          - service: ai-service
            context: backend
            dockerfile: backend/services/ai-service/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: |
          echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> ${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=ref,event=branch

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
