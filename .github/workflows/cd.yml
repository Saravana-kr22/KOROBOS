name: KOROBOS CD Pipeline

# Continuous Deployment Pipeline
# Deployment flow: CI success → Update manifests → Deploy to environments
#
# Supported deployment targets:
# - Development (develop → Docker Compose or K8s)
# - Staging (main → Kubernetes)
# - Production (main → Kubernetes, after staging succeeds)
#
# Features:
# - GitOps-based deployment with Helm and ArgoCD
# - Multi-environment support (dev, staging, production)
# - Service health checks post-deployment
# - Automatic image tag updates
# - Rollback procedures

permissions:
  contents: write
  packages: read

on:
  workflow_run:
    workflows: ["KOROBOS CI Pipeline"]
    types: [completed]
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================================
  # DEVELOPMENT DEPLOYMENT (develop branch)
  # ============================================================================

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> ${GITHUB_ENV}

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Update Helm chart image tags
        if: hashFiles('infrastructure/helm/charts/*/values.yaml') != ''
        run: |
          SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
          echo "Updating Helm charts to tag: sha-${SHORT_SHA}"

          for chart_path in infrastructure/helm/charts/*/values.yaml; do
            if [ -f "$chart_path" ]; then
              svc=$(basename "$(dirname "$chart_path")")
              sed -i "s|tag: .*|tag: sha-${SHORT_SHA}|g" "$chart_path"
              sed -i "s|repository: .*|repository: ${IMAGE_PREFIX}/${svc}|g" "$chart_path"
              echo "✓ Updated $svc Helm values"
            fi
          done
        continue-on-error: true

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Validate Helm charts
        run: |
          echo "Validating Helm charts..."
          for chart_dir in infrastructure/helm/charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              chart_name=$(basename "$chart_dir")
              echo "Linting $chart_name..."
              helm lint "$chart_dir" || echo "⚠ Lint warnings in $chart_name"
              echo "✓ $chart_name chart is valid"
            fi
          done
        continue-on-error: true

      - name: Pre-deployment validation
        run: |
          echo "🔍 Running pre-deployment validation..."
          if [ -f "scripts/deployment/pre_deploy_validate.sh" ]; then
            chmod +x scripts/deployment/pre_deploy_validate.sh
            scripts/deployment/pre_deploy_validate.sh development false || {
              echo "⚠️  Pre-deployment validation detected issues (non-blocking)"
            }
          fi
        continue-on-error: true

      - name: Verify service configurations
        run: |
          echo "Verifying service configurations..."

          # Check AI service config if exists
          if [ -d "infrastructure/helm/charts/ai-service" ]; then
            echo "✓ AI service Helm chart found"
          fi

          # Check docker-compose for all services
          if grep -q "postgres:" docker-compose.yml; then echo "✓ PostgreSQL configured"; fi
          if grep -q "redis:" docker-compose.yml; then echo "✓ Redis configured"; fi
          if grep -q "kafka:" docker-compose.yml; then echo "✓ Kafka configured"; fi
          if grep -q "api-gateway:" docker-compose.yml; then echo "✓ API Gateway configured"; fi

      - name: Commit Helm chart updates
        if: hashFiles('infrastructure/helm/charts/*/values.yaml') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add infrastructure/helm/charts/*/values.yaml

          if ! git diff --cached --quiet; then
            SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
            git commit -m "chore(deploy): update dev image tags to sha-${SHORT_SHA}"
            git push origin HEAD:develop
            echo "✓ Helm charts committed and pushed"
          else
            echo "No Helm chart changes to commit"
          fi
        continue-on-error: true

      - name: Discover services
        id: discover
        run: |
          if [ -f "scripts/deployment/discover_services.sh" ]; then
            chmod +x scripts/deployment/discover_services.sh
            # Output as shell format for use in this job
            eval "$(scripts/deployment/discover_services.sh shell)"
          else
            # Fallback to hardcoded list
            INFRASTRUCTURE_SERVICES="postgres redis kafka"
            BACKEND_SERVICES="api-gateway auth-service notes-service database-service habit-service learning-service health-service analytics-service notification-service ai-service dashboard-service graph-service search-service"
            WORKERS="workers"
            ALL_SERVICES="$INFRASTRUCTURE_SERVICES $BACKEND_SERVICES $WORKERS"
          fi

          echo "Discovered services: $ALL_SERVICES"
          echo "infrastructure_services=$INFRASTRUCTURE_SERVICES" >> $GITHUB_OUTPUT
          echo "backend_services=$BACKEND_SERVICES" >> $GITHUB_OUTPUT
          echo "workers=$WORKERS" >> $GITHUB_OUTPUT
          echo "all_services=$ALL_SERVICES" >> $GITHUB_OUTPUT

      - name: Trigger ArgoCD sync (if configured)
        if: vars.ARGOCD_SERVER != ''
        run: |
          SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
          echo "Deploying services with tag: sha-${SHORT_SHA}"

          if [ -z "${{ secrets.ARGOCD_TOKEN }}" ]; then
            echo "⚠ ARGOCD_TOKEN not configured, skipping ArgoCD sync"
            exit 0
          fi

          # Deploy core infrastructure first
          for svc in ${{ steps.discover.outputs.infrastructure_services }}; do
            echo "Syncing $svc..."
            curl -s -X POST "https://${{ vars.ARGOCD_SERVER }}/api/v1/applications/${svc}-dev/sync" \
              -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{}' || echo "⚠ Failed to sync $svc"
          done

          # Deploy backend services
          for svc in ${{ steps.discover.outputs.backend_services }} ${{ steps.discover.outputs.workers }}; do
            echo "Syncing $svc..."
            curl -s -X POST "https://${{ vars.ARGOCD_SERVER }}/api/v1/applications/${svc}-dev/sync" \
              -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{}' || echo "⚠ Failed to sync $svc"
          done

          # Verify critical service health
          echo "Verifying service health..."
          for svc in postgres api-gateway auth-service; do
            health_url="http://localhost:8080/api/v1/health"
            if [ "$svc" = "postgres" ]; then
              echo "✓ PostgreSQL deployed"
            else
              curl -s "$health_url" | grep -q "healthy" && echo "✓ $svc is healthy" || echo "⚠ $svc health check pending"
            fi
          done
        continue-on-error: true

      - name: Post-deployment validation (smoke tests)
        run: |
          echo "🧪 Running post-deployment smoke tests..."
          if [ -f "scripts/deployment/post_deploy_validate.sh" ]; then
            chmod +x scripts/deployment/post_deploy_validate.sh
            scripts/deployment/post_deploy_validate.sh development http://localhost:8080 || {
              echo "⚠️  Post-deployment validation detected issues (may be expected on first deploy)"
            }
          fi
        continue-on-error: true

  # ============================================================================
  # STAGING DEPLOYMENT (main branch)
  # ============================================================================

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> ${GITHUB_ENV}

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Update Helm chart image tags for staging
        if: hashFiles('infrastructure/helm/charts/*/values.staging.yaml') != ''
        run: |
          SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
          echo "Updating Helm charts for staging to tag: sha-${SHORT_SHA}"

          for chart_path in infrastructure/helm/charts/*/values.staging.yaml; do
            if [ -f "$chart_path" ]; then
              svc=$(basename "$(dirname "$chart_path")")
              sed -i "s|tag: .*|tag: sha-${SHORT_SHA}|g" "$chart_path"
              sed -i "s|repository: .*|repository: ${IMAGE_PREFIX}/${svc}|g" "$chart_path"
              echo "✓ Updated $svc staging Helm values"
            fi
          done
        continue-on-error: true

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Validate Helm charts for staging
        run: |
          echo "Validating Helm charts for staging..."
          for chart_dir in infrastructure/helm/charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              chart_name=$(basename "$chart_dir")
              echo "Linting $chart_name..."
              helm lint "$chart_dir" || echo "⚠ Lint warnings in $chart_name"
              echo "✓ $chart_name chart is valid"
            fi
          done
        continue-on-error: true

      - name: Verify staging configurations
        run: |
          echo "Verifying staging configurations..."

          required_files=(
            "infrastructure/helm/charts/api-gateway"
            "infrastructure/helm/charts/auth-service"
            "infrastructure/helm/charts/postgres"
            "infrastructure/helm/charts/redis"
          )

          for dir in "${required_files[@]}"; do
            if [ -d "$dir" ]; then
              echo "✓ $dir exists"
            else
              echo "⚠ $dir not found"
            fi
          done

      - name: Commit staging Helm chart updates
        if: hashFiles('infrastructure/helm/charts/*/values.staging.yaml') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add infrastructure/helm/charts/*/values.staging.yaml

          if ! git diff --cached --quiet; then
            SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
            git commit -m "chore(deploy): update staging image tags to sha-${SHORT_SHA}"
            git push origin HEAD:main
            echo "✓ Staging Helm charts committed and pushed"
          else
            echo "No staging Helm chart changes to commit"
          fi
        continue-on-error: true

      - name: Discover services for staging
        id: discover-staging
        run: |
          if [ -f "scripts/deployment/discover_services.sh" ]; then
            chmod +x scripts/deployment/discover_services.sh
            eval "$(scripts/deployment/discover_services.sh shell)"
          else
            INFRASTRUCTURE_SERVICES="postgres redis kafka zookeeper"
            BACKEND_SERVICES="api-gateway auth-service notes-service database-service habit-service learning-service health-service analytics-service notification-service ai-service dashboard-service graph-service search-service"
            WORKERS="workers"
            ALL_SERVICES="$INFRASTRUCTURE_SERVICES $BACKEND_SERVICES $WORKERS"
          fi

          echo "all_services=$ALL_SERVICES" >> $GITHUB_OUTPUT

      - name: Trigger ArgoCD sync for staging (if configured)
        if: vars.ARGOCD_SERVER != ''
        run: |
          SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
          echo "Deploying to staging with tag: sha-${SHORT_SHA}"

          if [ -z "${{ secrets.ARGOCD_TOKEN }}" ]; then
            echo "⚠ ARGOCD_TOKEN not configured, skipping ArgoCD sync"
            exit 0
          fi

          # Deploy all discovered services
          for svc in ${{ steps.discover-staging.outputs.all_services }}; do
            echo "Syncing $svc to staging..."
            curl -s -X POST "https://${{ vars.ARGOCD_SERVER }}/api/v1/applications/${svc}-staging/sync" \
              -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{}' || echo "⚠ Failed to sync $svc to staging"
          done
        continue-on-error: true

      - name: Verify staging deployment health
        if: vars.ARGOCD_SERVER != ''
        run: |
          if [ -z "${{ secrets.ARGOCD_TOKEN }}" ]; then
            echo "⚠ ARGOCD_TOKEN not configured, skipping health check"
            exit 0
          fi

          echo "Checking staging deployment health..."

          critical_services=(
            "postgres" "redis" "api-gateway" "ai-service"
          )

          for svc in "${critical_services[@]}"; do
            status=$(curl -s "https://${{ vars.ARGOCD_SERVER }}/api/v1/applications/${svc}-staging" \
              -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" 2>/dev/null | grep -o '"health":{"status":"[^"]*' | cut -d'"' -f6)

            if [ "$status" = "Healthy" ]; then
              echo "✓ $svc is healthy in staging"
            else
              echo "⚠ $svc status in staging: $status"
            fi
          done
        continue-on-error: true

  # ============================================================================
  # PRODUCTION DEPLOYMENT (main branch, after staging succeeds)
  # ============================================================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production
    needs: [deploy-staging]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> ${GITHUB_ENV}

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Promote staging images to production
        run: |
          SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
          echo "Promoting verified staging images (sha-${SHORT_SHA}) to production"

          # In a real production setup, you would:
          # 1. Verify staging deployment is fully healthy
          # 2. Re-tag staging images as production
          # 3. Update production Helm values with new tags

          echo "Production promotion request: sha-${SHORT_SHA}"

      - name: Update production Helm values
        if: hashFiles('infrastructure/helm/charts/*/values.prod.yaml') != ''
        run: |
          SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
          echo "Updating production Helm values to tag: sha-${SHORT_SHA}"

          for chart_path in infrastructure/helm/charts/*/values.prod.yaml; do
            if [ -f "$chart_path" ]; then
              svc=$(basename "$(dirname "$chart_path")")
              sed -i "s|tag: .*|tag: sha-${SHORT_SHA}|g" "$chart_path"
              sed -i "s|repository: .*|repository: ${IMAGE_PREFIX}/${svc}|g" "$chart_path"
              echo "✓ Updated $svc production Helm values"
            fi
          done
        continue-on-error: true

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Validate Helm charts for production
        run: |
          echo "Validating Helm charts for production..."
          for chart_dir in infrastructure/helm/charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              chart_name=$(basename "$chart_dir")
              echo "Linting $chart_name..."
              helm lint "$chart_dir" || echo "⚠ Lint warnings in $chart_name"
              echo "✓ $chart_name chart is valid"
            fi
          done
        continue-on-error: true

      - name: Verify production configurations
        run: |
          echo "Verifying production configurations..."

          critical_files=(
            "infrastructure/helm/charts/postgres/values.prod.yaml"
            "infrastructure/helm/charts/redis/values.prod.yaml"
            "infrastructure/helm/charts/api-gateway/values.prod.yaml"
          )

          for file in "${critical_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "⚠ $file not found (may be expected)"
            fi
          done

      - name: Commit production Helm chart updates
        if: hashFiles('infrastructure/helm/charts/*/values.prod.yaml') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add infrastructure/helm/charts/*/values.prod.yaml

          if ! git diff --cached --quiet; then
            SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
            git commit -m "chore(deploy): promote production image tags to sha-${SHORT_SHA}"
            git push origin HEAD:main
            echo "✓ Production Helm charts committed and pushed"
          else
            echo "No production Helm chart changes to commit"
          fi
        continue-on-error: true

      - name: Discover services for production
        id: discover-prod
        run: |
          if [ -f "scripts/deployment/discover_services.sh" ]; then
            chmod +x scripts/deployment/discover_services.sh
            eval "$(scripts/deployment/discover_services.sh shell)"
          else
            INFRASTRUCTURE_SERVICES="postgres redis kafka"
            BACKEND_SERVICES="api-gateway auth-service notes-service database-service habit-service learning-service health-service analytics-service notification-service ai-service dashboard-service graph-service search-service"
            WORKERS="workers"
          fi

          echo "infrastructure_services=$INFRASTRUCTURE_SERVICES" >> $GITHUB_OUTPUT
          echo "backend_services=$BACKEND_SERVICES" >> $GITHUB_OUTPUT
          echo "workers=$WORKERS" >> $GITHUB_OUTPUT

      - name: Trigger ArgoCD sync for production (if configured)
        if: vars.ARGOCD_SERVER != ''
        run: |
          SHORT_SHA="${{ steps.tags.outputs.SHORT_SHA }}"
          echo "Deploying to production with tag: sha-${SHORT_SHA}"

          if [ -z "${{ secrets.ARGOCD_TOKEN }}" ]; then
            echo "⚠ ARGOCD_TOKEN not configured, skipping ArgoCD sync"
            exit 0
          fi

          # Deploy critical infrastructure first
          echo "Deploying critical infrastructure..."
          for svc in ${{ steps.discover-prod.outputs.infrastructure_services }}; do
            echo "Syncing $svc..."
            curl -s -X POST "https://${{ vars.ARGOCD_SERVER }}/api/v1/applications/${svc}-prod/sync" \
              -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{}' || echo "⚠ Failed to sync $svc"
            sleep 5
          done

          # Deploy backend services and workers
          echo "Deploying all services..."
          for svc in ${{ steps.discover-prod.outputs.backend_services }} ${{ steps.discover-prod.outputs.workers }}; do
            echo "Syncing $svc..."
            curl -s -X POST "https://${{ vars.ARGOCD_SERVER }}/api/v1/applications/${svc}-prod/sync" \
              -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{}' || echo "⚠ Failed to sync $svc"
          done
        continue-on-error: true

      - name: Verify production deployment health
        if: vars.ARGOCD_SERVER != ''
        run: |
          if [ -z "${{ secrets.ARGOCD_TOKEN }}" ]; then
            echo "⚠ ARGOCD_TOKEN not configured, skipping health check"
            exit 0
          fi

          echo "Checking production deployment health..."

          critical_services=(
            "postgres" "redis" "api-gateway" "ai-service" "auth-service"
          )

          for svc in "${critical_services[@]}"; do
            status=$(curl -s "https://${{ vars.ARGOCD_SERVER }}/api/v1/applications/${svc}-prod" \
              -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" 2>/dev/null | grep -o '"health":{"status":"[^"]*' | cut -d'"' -f6)

            if [ "$status" = "Healthy" ]; then
              echo "✓ $svc is healthy in production"
            else
              echo "⚠ $svc status in production: $status"
            fi
          done

          echo "Production deployment verification complete"
        continue-on-error: true

  # ============================================================================
  # NOTIFICATION & MONITORING
  # ============================================================================

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy-development, deploy-staging, deploy-production]

    steps:
      - name: Check deployment status
        run: |
          echo "Deployment Pipeline Summary"
          echo "============================"

          if [ "${{ needs.deploy-development.result }}" = "success" ]; then
            echo "✓ Development deployment succeeded"
          elif [ "${{ needs.deploy-development.result }}" = "skipped" ]; then
            echo "⊘ Development deployment skipped (not develop branch)"
          else
            echo "✗ Development deployment failed"
          fi

          if [ "${{ needs.deploy-staging.result }}" = "success" ]; then
            echo "✓ Staging deployment succeeded"
          elif [ "${{ needs.deploy-staging.result }}" = "skipped" ]; then
            echo "⊘ Staging deployment skipped (not main branch)"
          else
            echo "✗ Staging deployment failed"
          fi

          if [ "${{ needs.deploy-production.result }}" = "success" ]; then
            echo "✓ Production deployment succeeded"
          elif [ "${{ needs.deploy-production.result }}" = "skipped" ]; then
            echo "⊘ Production deployment skipped (not after staging)"
          else
            echo "✗ Production deployment failed"
          fi
