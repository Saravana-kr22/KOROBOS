repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: |
          (?x)^(
            infrastructure/helm/.*\.yaml|
            infrastructure/kubernetes/.*\.yaml
          )$
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.63.0
    hooks:
      - id: trufflehog
        name: TruffleHog - Secrets
        entry: bash -c 'command -v trufflehog && trufflehog filesystem . --only-verified --fail || true'
        language: system
        types: [text]
        stages: [pre-commit]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile, black]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings, types-redis, rich, sqlalchemy]
        args: [--ignore-missing-imports, --check-untyped-defs, --follow-imports=silent, --no-incremental]
        files: ^backend/shared/
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, markdown]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^(frontend|mobile)/
        types: [javascript, jsx, ts, tsx]
        additional_dependencies:
          - eslint
          - eslint-config-prettier
          - '@typescript-eslint/eslint-plugin'
          - '@typescript-eslint/parser'
        args: [--fix]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.1-beta
    hooks:
      - id: hadolint-docker
        name: Hadolint
        args: [--failure-threshold=error]
        types: [dockerfile]

  - repo: local
    hooks:
      - id: check-copyright
        name: check-copyright
        entry: scripts/compliance/check_copyright.py
        language: python
        types: [text]
        exclude: ^(\.git|node_modules|\.next|venv|env)/

      - id: check-licenses
        name: License Compliance Check
        entry: bash -c 'python3 -m pip install -q pyyaml 2>/dev/null; python3 scripts/compliance/check_licenses.py || true'
        language: system
        files: (requirements\.txt|package\.json|poetry\.lock|package-lock\.json)$
        stages: [pre-commit]
