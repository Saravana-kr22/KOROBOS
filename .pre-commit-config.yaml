repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: |
          (?x)^(
            infrastructure/helm/.*\.yaml|
            infrastructure/kubernetes/.*\.yaml
          )$
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.280
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [--profile, black]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings, types-redis, rich]
        args: [--ignore-missing-imports, --check-untyped-defs, --follow-imports=silent]
        exclude: ^backend/services/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, json, markdown]

  - repo: local
    hooks:
      - id: check-copyright
        name: check-copyright
        entry: scripts/compliance/check_copyright.py
        language: python
        types: [text]
        exclude: ^(\.git|node_modules|\.next|venv|env)/
