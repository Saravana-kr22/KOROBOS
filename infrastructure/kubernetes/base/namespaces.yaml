# KOROBOS Kubernetes Base Namespace Configuration
# §5 Kubernetes Cluster Setup — Namespaces

---
apiVersion: v1
kind: Namespace
metadata:
  name: korobos-dev
  labels:
    project: korobos
    environment: dev

---
apiVersion: v1
kind: Namespace
metadata:
  name: korobos-staging
  labels:
    project: korobos
    environment: staging

---
apiVersion: v1
kind: Namespace
metadata:
  name: korobos-prod
  labels:
    project: korobos
    environment: prod

---
# Ingress Controller Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: korobos-ingress
  labels:
    project: korobos
    component: ingress
