# KOROBOS ArgoCD Application of Applications
# §9 Continuous Deployment (GitOps)
# Deployment flow: Developer push → CI build → Helm chart update → ArgoCD deploy

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: korobos
  namespace: argocd
spec:
  description: KOROBOS Platform
  sourceRepos:
    - "*"
  destinations:
    - namespace: korobos-dev
      server: https://kubernetes.default.svc
    - namespace: korobos-staging
      server: https://kubernetes.default.svc
    - namespace: korobos-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

---
# Auth Service
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: korobos
  source:
    repoURL: https://github.com/Saravana-kr22/KOROBOS.git
    targetRevision: HEAD
    path: infrastructure/helm/charts/auth-service
  destination:
    server: https://kubernetes.default.svc
    namespace: korobos-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

