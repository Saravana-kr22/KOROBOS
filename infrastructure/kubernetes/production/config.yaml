# KOROBOS Production Environment Config
# §3 Environment Strategy — Production: live customer system, HA, autoscaling

apiVersion: v1
kind: ConfigMap
metadata:
  name: korobos-env-config
  namespace: korobos-prod
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "WARNING"
  DATABASE_URL: "postgresql+asyncpg://korobos:${DB_PASSWORD}@korobos-prod-postgres.rds.amazonaws.com:5432/korobos"
  REDIS_URL: "redis://korobos-prod-redis.cache.amazonaws.com:6379/0"
  KAFKA_BROKER: "korobos-prod-kafka.msk.amazonaws.com:9092"
  SEARCH_URL: "http://meilisearch.korobos-prod:7700"
  OBJECT_STORAGE_URL: "https://korobos-prod-storage.s3.amazonaws.com"
