[tool.poetry]
name = "korobos-backend"
version = "0.1.0"
description = "Backend microservices for KOROBOS."
authors = ["KOROBOS Devs <devs@korobos.local>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.135.0"
starlette = "^0.49.1"
uvicorn = "^0.34.0"
pydantic = "^2.0"
pydantic-settings = "^2.7.1"
sqlalchemy = "^2.0"
alembic = "^1.13.0"
asyncpg = "^0.28.0"
redis = "^5.0"
aiokafka = "^0.10.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.22"
pyjwt = "^2.12.0"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
ruff = "^0.7.0"
mypy = "^1.12.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.1"
testcontainers = {extras = ["kafka"], version = "^4.14.1"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
select = ["E", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["..", ".", "gateway/api-gateway"]
testpaths = ["tests"]
