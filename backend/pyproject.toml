[tool.poetry]
name = "cortexos-backend"
version = "0.1.0"
description = "Backend microservices for CortexOS."
authors = ["CortexOS Devs <devs@cortexos.local>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.103.0"
uvicorn = "^0.23.0"
pydantic = "^2.0"
sqlalchemy = "^2.0"
asyncpg = "^0.28.0"
redis = "^5.0"
kafka-python = "^2.0.2"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
black = "^23."
ruff = "^0.0."
mypy = "^1.5."
pytest = "^7.4."
pytest-asyncio = "^0.21.0"
httpx = "^0.24.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
